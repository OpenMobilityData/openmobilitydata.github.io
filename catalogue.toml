# Catalogue of the OpenMobilityData site: the single source for every page.
# Edit this file, then run:  python3 build.py --check-links
#
# An entry belongs to one topic and one section ("topic/section") and may be
# listed again elsewhere with `also`. `repo` + `path` name a folder (or, with
# no path, a repository); its README is the entry's main link. `links` adds
# documents: {label, path} is a file in the same repository, {label, url} an
# outside address. Summaries describe; they do not evaluate.
#
# status: record | checked | machine-draft | analysis | preliminary | draft |
#         data | app | tool

[site]
name = "OpenMobilityData"
tagline = "Public records and open data on mobility in Montréal"
org = "OpenMobilityData"
pages_repos = ["Terrebonne-access-requests", "Terrebonne-open-sources"]
intro = """
Documents and datasets kept with their provenance, and the code that reads them.

Most of the material was assembled around one question: the protected bike lane on rue de Terrebonne, in Côte-des-Neiges–Notre-Dame-de-Grâce, and the borough's plan of October 2026 to convert one direction to parking each winter. Much of it is city-wide and is meant to outlast that question: police-reported collisions for the whole island, vehicle registrations, the City's access-to-information releases, the City's bicycle counters.

Every entry links to a folder whose README says what the document is, who issued it, where and when it was obtained, and how each table and figure can be reproduced.
"""

# ----------------------------------------------------------------- topics

[[topic]]
id = "terrebonne"
title = "Rue de Terrebonne"
nav = "Terrebonne"
lede = "The protected bike lane built in 2024 and the winter measure proposed in October 2026: the decisions, what was said, the records released under the Access Act, and the measurements."
sections = [
  ["start", "Start here", "Three ways into the record."],
  ["decisions", "Decisions and plans, 2020–2026", "Council files, studies, plans and notices, as issued, in order of date.", "by-date"],
  ["said", "Council sittings and interviews", "Transcripts of the passages on the lane. A checked transcript has been verified by ear against the recording; a machine draft has not, and is not to be quoted. In order of date.", "by-date"],
  ["access", "Records released under the Access Act", "One folder per request, with the documents exactly as received."],
  ["counts", "How many people ride", "The counters, and the analyses built on them."],
  ["parking", "Parking and curb", "Supply, registered automobiles and private places along the street."],
  ["street", "The street and the winter layout", "Width, the shared lane, and other cities' documented experience."],
  ["community", "Petitions, survey, schools and congregations", "What residents and institutions have put on record."],
]

[[topic]]
id = "road-safety"
title = "Road safety"
lede = "Police-reported collisions on the island of Montréal, 2011–2022, with maps, charts and tests of what the record can and cannot show."
sections = [
  ["record", "The police record", "Two series, kept separate: the City's SPVM open data and the SAAQ accident reports."],
  ["press", "The press record", "Captures of news reports, with their source and date."],
  ["policy", "Policy", ""],
]

[[topic]]
id = "vehicles"
title = "Vehicles and parking"
nav = "Vehicles"
lede = "Vehicle registrations in Québec, one record per vehicle, and what they give when set beside the length of legal curb."
sections = [
  ["registrations", "Registrations", ""],
  ["curb", "Automobiles and curb", "Hypothetical bounds, not measurements of parking pressure: each folder states its assumptions."],
]

[[topic]]
id = "counting"
title = "Counting"
lede = "Bicycle and traffic counts: the sensors, their records, and the analyses of use by season, weather and location."
sections = [
  ["sensors", "Sensors and their records", ""],
  ["analyses", "Analyses", ""],
]

[[topic]]
id = "access-requests"
title = "Access requests"
lede = "Records released under Québec's Act respecting access to documents held by public bodies, exactly as received, with the request, the decision and derived summaries kept apart."
sections = [
  ["terrebonne", "On rue de Terrebonne", ""],
  ["montreal", "City of Montréal, other subjects", ""],
]

[[topic]]
id = "applications"
title = "Applications and tools"
nav = "Applications"
lede = "Web applications that read the same records, and smaller tools."
sections = [
  ["web", "Web applications", ""],
  ["tools", "Tools and earlier work", ""],
]

